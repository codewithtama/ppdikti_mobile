name: Build & Release OTA APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag versi rilis (contoh: v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  release:
    name: Build Signed APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Configure Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            cat <<EOF > android/key.properties
            storePassword=$STORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=upload-keystore.jks
          EOF
            echo "Keystore release berhasil dikonfigurasi."
          else
            echo "Secrets keystore tidak ditemukan. Menggunakan default debug signature fallback."
          fi

      - name: Build Release APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Calculate SHA-256 Checksum
        id: checksum
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "$SHA256  app-release.apk" > build/app/outputs/flutter-apk/app-release.apk.sha256
          echo "APK SHA-256: $SHA256"

      - name: Update Version Manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
          SHA256_HASH: ${{ steps.checksum.outputs.sha256 }}
        run: |
          CLEAN_VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
          DATE_NOW=$(date +%Y-%m-%d)
          cat <<EOF > version.json
          {
            "version": "$CLEAN_VERSION",
            "build_number": ${{ github.run_number }},
            "release_date": "$DATE_NOW",
            "changelog": [
              "Pembaruan rilis $TAG_NAME",
              "Peningkatan performa dan pemutakhiran data PDDikti"
            ],
            "download_url": "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/app-release.apk",
            "sha256": "$SHA256_HASH",
            "force_update": false
          }
          EOF
          cp version.json build/app/outputs/flutter-apk/version.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PDDikti Mobile ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
            build/app/outputs/flutter-apk/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

